<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To Do List TypeScript</title>
</head>

<body>
  <div id="app">
    <h1>To Do List</h1>
    <input id="todo-input" placeholder="Nuova Attività">
    <button id="add-btn">Aggiungi</button>
    <div id="filters">
      <button id="filter-all">Tutte</button>
      <button id="filter-active">Da fare</button>
      <button id="filter-completed">Completate</button>
    </div>
    <ul id="todo-list"></ul>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
